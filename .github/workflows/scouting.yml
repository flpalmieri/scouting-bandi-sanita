name: Scouting bandi sanità

on:
  schedule:
    - cron: "0 5 * * *"   # ogni giorno alle 05:00 UTC
  workflow_dispatch:       # avvio manuale dalla scheda Actions

permissions:
  contents: write

concurrency:
  group: scouting
  cancel-in-progress: false

jobs:
  scouting:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Raccogli bandi
        run: python -m scout.main

      - name: Salva i risultati nel repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdir -p data state
          git add data state
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
            exit 0
          fi
          git commit -m "Aggiornamento bandi $(date -u +%F)"
          # Se nel frattempo il repository è cambiato, integra le modifiche e riprova
          for tentativo in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push non riuscito, nuovo tentativo tra 10 secondi"
            sleep 10
          done
          exit 1
