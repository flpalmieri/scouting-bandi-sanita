      # User-Agent: il PAT risponde 403 a ogni User-Agent che inizia con "Mozilla/5.0" (quello di
      # browser che mandava il programma) e 200 a quello dichiarato del progetto, anche da GitHub.
      # Con user_agent: progetto il programma si presenta per quello che e'.
      # Si legge la pagina "Avvisi" (indagini di mercato, avvisi esplorativi, consultazioni), non
