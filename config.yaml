# =====================================================================
#  Scouting bandi software / IT in ambito sanitario - configurazione
# =====================================================================

# --- Filtro CPV --------------------------------------------------------
# Un avviso passa il filtro CPV se almeno uno dei suoi codici inizia con
# uno di questi prefissi (si confrontano solo le cifre, senza "-x").
cpv_prefissi:
  - "48"        # Pacchetti software e sistemi di informazione
  - "72"        # Servizi informatici: consulenza, sviluppo, Internet, supporto
  # - "302"     # Apparecchiature informatiche (decommenta se ti interessa l'hardware)
  # - "64216"   # Servizi di messaggistica e informazione elettronica

# CPV che vengono inclusi SEMPRE, anche se l'ente non risulta sanitario.
cpv_sempre_inclusi:
  - "48180000"  # Pacchetti software medici
  - "48814000"  # Sistemi di informazione medica

# --- Riconoscimento enti sanitari -------------------------------------
# Espressioni regolari (case-insensitive) sul nome della stazione appaltante.
enti_sanitari_regex:
  - '\bA\.?S\.?L\b'
  - '\bA\.?S\.?P\b'
  - '\bASST\b'
  - '\bATS\b'
  - '\bA\.?U\.?S\.?L\b'
  - '\bU\.?L\.?S\.?S\b'
  - '\bU\.?S\.?L\b'
  - '\bASU\s?(FC|GI)\b'
  - '\bAST\b'
  - '\bASUR\b'
  - '\bARCS\b'
  - '\bAREU\b'
  - '\bIRCCS\b'
  - 'azienda\s+(socio[\s-]?)?sanitari'
  - 'azienda\s+(universitari\w*\s+)?ospedalier'
  - 'ospedal'
  - 'policlinic'
  - 'istituto\s+zooprofilattico'
  - 'istituto\s+(nazionale\s+)?(dei\s+)?tumori'
  - 'azienda\s+zero'
  - '\bESTAR\b'
  - 'so\.?re\.?sa'
  - 'servizio\s+sanitario'
  - 'agenzia\s+regionale.*salute'

# Soggetti aggregatori che comprano sia per la sanità sia per altri settori:
# le loro gare IT vengono incluse ma marcate "da verificare".
aggregatori_misti_regex:
  - 'intercent'
  - '\bARIA\b'
  - 'azienda\s+regionale\s+per\s+l.innovazione\s+e\s+gli\s+acquisti'
  - '\bconsip\b'
  - 'centrale\s+(unica\s+)?(di\s+)?committenza'
  - 'soggetto\s+aggregatore'

# Parole chiave sul titolo/oggetto che indicano un contesto sanitario
# (servono per enti non sanitari, es. una Regione che compra un sistema FSE).
parole_chiave_sanita_regex:
  - 'sanitari'
  - 'ospedal'
  - 'clinic'
  - 'telemedicin'
  - 'telemonitor'
  - 'teleconsult'
  - 'fascicolo\s+sanitario'
  - '\bFSE\b'
  - 'cartella\s+clinica'
  - '\bRIS\b'
  - '\bPACS\b'
  - '\bLIS\b'
  - 'centro\s+unic\w*\s+(di\s+)?prenotazion'   # NB: non usare "CUP", collide con il Codice Unico di Progetto
  - 'prenotazion\w*\s+(delle\s+)?(prestazion|visite|esami)'
  - 'pronto\s+soccorso'
  - 'farmac'
  - 'pazient'
  - 'ricoveri'
  - 'ambulatori'
  - 'dossier\s+sanitario'
  - 'medicina\s+(generale|territoriale)'
  - 'case\s+della\s+comunit'
  - 'centrali\s+operative\s+territoriali|\bCOT\b'

# Esclusioni: se il titolo contiene una di queste, l'avviso viene scartato.
esclusioni_regex:
  - 'pulizi'
  - 'ristorazion'
  - 'lavanderi'
  - 'vigilanza\s+armata'

# --- TED (Tenders Electronic Daily) -----------------------------------
ted:
  abilitato: true
  url: "https://api.ted.europa.eu/v3/notices/search"
  finestra_giorni: 10          # quanti giorni indietro guardare a ogni esecuzione
                               # (per recuperare lo storico alzalo a 90 per un lancio, poi riportalo a 10)
  max_pagine: 40               # 250 avvisi per pagina
  # Tipi di avviso da tenere (prefissi): cn = bando, pin = preinformazione.
  # Aggiungi "can" per raccogliere anche le aggiudicazioni.
  tipi_avviso_prefissi: ["cn", "pin"]
  campi:
    - publication-number
    - publication-date
    - notice-title
    - buyer-name
    - classification-cpv
    - deadline-receipt-tender-date-lot
    - notice-type
    - estimated-value-lot
    - links

# --- ANAC open data (dataset CIG) -------------------------------------
anac:
  abilitato: true
  base_url: "https://dati.anticorruzione.it/opendata"
  dataset_pattern: "cig-{anno}"    # id del dataset CKAN, un dataset per anno
  mesi_da_elaborare: 2             # al primo avvio, quanti file mensili recenti leggere
  solo_aperte: true                # tieni solo gare con scadenza offerta futura
  includi_senza_scadenza: false
  # Se l'API del portale risponde 403, lo script prova a scaricare direttamente
  # i file mensili con questo modello di indirizzo. Lascia vuoto se non serve.
  # Per compilarlo: apri il dataset CIG sul portale ANAC dal browser e copia il
  # link di download di un file mensile, sostituendo anno e mese con {anno} e {mese}.
  url_file_pattern: ""

# --- Conservazione -----------------------------------------------------
giorni_conservazione_scadute: 30      # dopo la scadenza, per quanto tenere un avviso
giorni_conservazione_senza_scadenza: 120
