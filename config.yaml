      regione: Liguria
      host: "https://www.galliera.it"
      percorso: "/amministrazione-trasparente/bandi-di-gara-e-contratti"
      tipi_contenuto: [Bando]
      max_risultati: 100
      escludi_titoli_regex:
        - '\baggiudicazion'
        - '\besito\b'
      # Le gare svolte su Sintel ("tramite piattaforma telematica SinTel") le legge gia' il
      # modulo sintel: si scartano qui per non averle due volte con nomi di ente diversi.
      escludi_descrizioni_regex:
        - '\bsintel\b'
      timeout_connessione: 20        # sito nuovo: se bloccasse GitHub, si perde poco tempo
      tentativi: 1

    - nome: Intercent-ER
      # Emilia-Romagna. Sito Plone/Volto dell'agenzia regionale: contiene le gare di Intercent-ER
      # e quelle che tutti gli enti emiliani (aziende sanitarie comprese) svolgono su SATER, che
      # non ha elenchi pubblici. Circa 41.000 voci storiche, 356 aperte al 19/11/2026.
      # L'ente sta solo nel dettaglio di ogni voce (@intercenter-data): lo si chiede solo per le
      # voci con parole IT nel titolo o nella descrizione (qualche decina), mai per le altre.
      nome_fonte: Intercent-ER
      sigla: intercenter
      regione: Emilia-Romagna
      host: "https://intercenter.regione.emilia-romagna.it"
      percorsi:
        - percorso: "/bandi-e-strumenti-di-acquisto/bandi-intercenter/bandi-e-procedure-di-gara"
        - percorso: "/bandi-e-strumenti-di-acquisto/bandi-altri-enti/altri-enti-bandi-e-procedure-di-gara"
        - percorso: "/bandi-e-strumenti-di-acquisto/bandi-altri-enti/altri-enti-avvisi-e-indagini-di-mercato"
          tipo: avviso esplorativo
        - percorso: "/bandi-e-strumenti-di-acquisto/bandi-altri-enti/altri-enti-consultazioni-preliminari"
          tipo: consultazione di mercato
      tipi_contenuto: [BandoIntercenter]
      solo_aperte: true            # solo scadenza futura, dalla piu' lontana; ci si ferma alle scadute
      max_risultati: 600           # per sezione (316 gare aperte degli altri enti al 19/11/2026)
      dettaglio: intercenter-data
      # 21 voci aperte su 356 non hanno ente_appaltante: con questo nome contengono "Intercent-ER"
      # e le IT entrano "da verificare" (come le gare dell'agenzia). Decisione di Flavio (20/11/2026):
      # tenerle cosi'. Per scartarle: ente_se_vuoto: ""
      ente_se_vuoto: "Ente non indicato (Intercent-ER)"
      escludi_stati: [Revocato, Annullato]   # stato_procedura del dettaglio (7 revocate al 19/11/2026)
      # Procedure a invito rivolte a un fornitore gia' scelto, come gli affidamenti diretti di Sintel
      # e di START Sanita' (decisione del 20/11/2026). Nei 18 dettagli del primo lancio: 9
      # "Affidamento Diretto" (tutti "Invito", comprese le "Richiesta di offerta art. 50 c.1 lett. b"),
      # 5 "Negoziata" (Invito), 2 "Aperta" (Bando), 2 consultazioni. Le Negoziata restano: sono
      # spesso ex art. 76 (unico fornitore), cioe' segnali di infungibilita'. Esclusione confermata
      # da Flavio il 20/11/2026.
      escludi_campi:
        procedura_gara: [Affidamento Diretto]
      pausa_secondi: 0.5
      timeout_connessione: 20        # fonte nuova: se bloccasse GitHub, si perde poco tempo
      tentativi: 1

# --- Centrale Acquisti Regione Lazio (STELLA): API REST del portale ----------
# La pagina "Bandi di gara in scadenza" di centraleacquisti.regione.lazio.it legge l'elenco da
# un servizio JSON pubblico (vedi scout/centrale_acquisti.py), con le scadenze aggiornate dopo
# rettifiche e proroghe. Tutte le aziende sanitarie pubbliche laziali (ASL, AO, Policlinici,
# IFO, INMI, ARES 118), la Regione e LAZIOcrea; non l'IZS Lazio e Toscana. Al 20/11/2026: 129
# gare e 41 consultazioni in corso. Gli SDA (4, tutti di farmaci) non si leggono.
centrale_acquisti:
  abilitato: true
  siti:
    - nome: STELLA gare
      nome_fonte: STELLA Lazio
      sigla: stella                  # stesse id del feed letto il 20/11/2026: lo storico continua
      regione: Lazio
      tipo: bando
      url: "https://centraleacquisti.regione.lazio.it/o/centrale-acquisti-service-rest/feed/getBandiAvvisi"
      tipologia: BANDO_GARA
      per_pagina: 50
      max_pagine: 10
      link: "https://centraleacquisti.regione.lazio.it/bandi-e-strumenti-di-acquisto/dettaglio-bando?tipo_doc=BANDO_GARA_PORTALE&id_doc={id}"
      # CPV, tipo di procedura e data di pubblicazione dalla scheda di dettaglio, solo per le
      # voci candidate e una volta sola per voce (cache in state/stella_dettagli.json). Il primo
      # lancio ne chiede circa 100; poi qualche unita' al giorno. RUP e contatti non si leggono.
      dettaglio: true
      url_dettaglio: "https://centraleacquisti.regione.lazio.it/o/centrale-acquisti-service-rest/feed/getXmlDocument"
      tipo_documento: BANDO_GARA_PORTALE
      pausa_secondi: 0.5
      max_dettagli: 200
      # Affidamenti diretti (PROCEDURAGARA "Affidamento Diretto", Invito: verificato sulla scheda
      # di 24373872, ASL Viterbo): esclusi come su Sintel, START e Intercent-ER. Le negoziate
      # (anche a invito) restano. Se il dettaglio non si legge, vale la formula iniziale del titolo
      # o dell'oggetto; le "indagini di mercato finalizzate all'affidamento diretto" restano.
      escludi_procedure: [Affidamento Diretto]
      escludi_oggetti_regex:
        - '^\s*bando\s+(revocato|annullato)\b'
        - '^\W*(bando\s+\w+\s*-\s*)?(procedura\s+(di|per)\s+(l\W?\s*)?)?affidamento\s+diretto\b'
      enti_rinomina:
        "Giunta Regionale": "Regione Lazio - Giunta Regionale"
        "Consiglio Regionale": "Regione Lazio - Consiglio Regionale"
      timeout_connessione: 20
      tentativi: 1
    - nome: STELLA consultazioni
      nome_fonte: STELLA Lazio
      sigla: stella-cons
      regione: Lazio
      tipo: consultazione di mercato
      url: "https://centraleacquisti.regione.lazio.it/o/centrale-acquisti-service-rest/feed/getBandiAvvisi"
      tipologia: BANDO_CONSULTAZIONE
      per_pagina: 50
      max_pagine: 10
      # Formato della pagina di dettaglio delle gare, con il tipo documento delle consultazioni
      # (lo stesso usato dal servizio di dettaglio): da verificare al primo lancio.
      link: "https://centraleacquisti.regione.lazio.it/bandi-e-strumenti-di-acquisto/dettaglio-bando?tipo_doc=BANDO_CONSULTAZIONE_PORTALE&id_doc={id}"
      escludi_oggetti_regex:
        - '^\s*bando\s+(revocato|annullato)\b'
      enti_rinomina:
        "Giunta Regionale": "Regione Lazio - Giunta Regionale"
        "Consiglio Regionale": "Regione Lazio - Consiglio Regionale"
      timeout_connessione: 20        # fonte nuova: se bloccasse GitHub, si perde poco tempo
      tentativi: 1

# --- Conservazione -----------------------------------------------------
giorni_conservazione_scadute: 30      # dopo la scadenza, per quanto tenere un avviso
giorni_conservazione_senza_scadenza: 120

# --- Piattaforme DigitalPA ("<ente>.acquistitelematici.it") --------------------
# L'elenco gare arriva da un servizio JSON (/ws/tender/fe) con titolo, date, stato,
# CPV, CIG e link. Molti enti italiani usano questa piattaforma: per aggiungerne uno
# basta un blocco con il suo indirizzo (host).
acquistitelematici:
  abilitato: true
  siti:
    - nome: IZSAM
      nome_fonte: IZSAM
      sigla: izsam
      host: "https://izs.acquistitelematici.it"
      ente: "IZSAM - Istituto Zooprofilattico Sperimentale dell'Abruzzo e del Molise G. Caporale"
      regione: Abruzzo
      tipi: [procedure-gara, manifestazioni-interesse]
      max_risultati: 50            # le più recenti per data di pubblicazione (circa 100 l'anno per tipo)
      escludi_stati: [annullata, tender_canceled]   # DigitalPA usa entrambi per le gare annullate (IZSM, 20/11/2026)
    - nome: IZSM
      # Campania (20/11/2026): l'IZS del Mezzogiorno (Portici) e' l'unico ente sanitario campano
      # che non usa SIAPS; ha la sua piattaforma DigitalPA (izsmportici.acquistitelematici.it/gare,
      # risponde senza login). Stesso servizio JSON dell'IZSAM: da verificare al primo lancio.
      nome_fonte: IZSM
      sigla: izsm
      host: "https://izsmportici.acquistitelematici.it"
      ente: "IZSM - Istituto Zooprofilattico Sperimentale del Mezzogiorno"
      regione: Campania
      tipi: [procedure-gara, manifestazioni-interesse]
      max_risultati: 50
      escludi_stati: [annullata, tender_canceled]   # DigitalPA usa entrambi per le gare annullate (IZSM, 20/11/2026)
    # Sicilia (23/11/2026). Fondazione Istituto G. Giglio di Cefalu': il buyer sanitario siciliano piu'
    # attivo su TED (104 avvisi dal 01/06/2026); sulla sua piattaforma DigitalPA 9 gare con scadenza
    # futura al 23/11/2026. Nome dell'ente come su TED, per la deduplica. I codici "L-0000..." delle
    # gare a lotti sono interni e si ignorano come gli "M-..." (RE_CIG_VERO).
    - nome: Fondazione Giglio Cefalu
      nome_fonte: Giglio Cefalu (DigitalPA)
      sigla: giglio
      host: "https://ospedalegiglio.acquistitelematici.it"
      ente: "Fondazione Istituto G. Giglio di Cefalù"
      regione: Sicilia
      tipi: [procedure-gara, manifestazioni-interesse]
      max_risultati: 50
      escludi_stati: [annullata, tender_canceled]
    # SEUS 118 (Sicilia Emergenza-Urgenza Sanitaria): 7 gare in tutto, ultima del 02/03/2026; due
    # richieste al giorno, per non perdere la prossima (centrale operativa, sistemi del 118).
    - nome: SEUS 118
      nome_fonte: SEUS 118 (DigitalPA)
      sigla: seus118
      host: "https://118sicilia.acquistitelematici.it"
      ente: "SEUS 118 - Sicilia Emergenza-Urgenza Sanitaria"
      regione: Sicilia
      tipi: [procedure-gara, manifestazioni-interesse]
      max_risultati: 50
      escludi_stati: [annullata, tender_canceled]
      # Le manifestazioni di interesse della SEUS hanno tutte lo stesso CPV di modello (72224000 +
      # 79111000): al primo lancio sono entrate come IT un supporto all'ufficio acquisti (449) e l'elenco
      # dei collegi consultivi tecnici (370). Solo filtro testuale.
      ignora_cpv: true

# --- Piattaforme JAGGAER (ex BravoSolution, indirizzi /esop/...) --------------------
# L'elenco pubblico "Avvisi in Area Pubblica" e' nell'HTML della pagina (vedi scout/jaggaer.py):
# procedura, stazione appaltante, titolo, tipologia, scadenza. Niente CPV: filtro testuale.
# Per un altro portale Jaggaer basta un blocco con url e link.
jaggaer:
  abilitato: true
  siti:
    # Friuli Venezia Giulia (20/11/2026): eAppaltiFVG, piattaforma regionale di ARCS, ASUGI, ASUFC,
    # ASFO, CRO, Burlo, Insiel, Regione, CUC FVG e comuni. 76 voci in corso in una sola pagina
    # (gare, manifestazioni di interesse, avvisi e preinformazioni insieme).
    - nome: eAppaltiFVG
      nome_fonte: eAppaltiFVG
      sigla: eappaltifvg
      regione: Friuli Venezia Giulia
      url: "https://eappalti.regione.fvg.it/esop/guest/go/public/opportunity/current"
      link: "https://eappalti.regione.fvg.it/esop/toolkit/opportunity/current/{id}/detail.si"
      # Valori di "Processi di Procurement" da scartare. Le aste di vendita non sono acquisti.
      # "Affidamento diretto" NON e' escluso (decisione di Flavio, 20/11/2026): nell'area pubblica di Jaggaer compaiono solo le
      # richieste di informazioni aperte a tutti ("RdI aperta a tutti volta all'affidamento
      # diretto", ASFO 26161), cioe' indagini di mercato a cui chiunque puo' rispondere, come le
      # indagini "finalizzate all'affidamento diretto" che si tengono su STELLA. Per escluderle
      # basta aggiungere "Affidamento diretto" all'elenco.
      escludi_procedure: [Asta di Vendita]
      # Avvisi generici per l'albo o l'elenco dei fornitori (senza oggetto di gara, scadenze fino
      # al 2099): non sono opportunita'.
      escludi_titoli_regex:
        - 'modalit\w*\s+(di|per\s+la)\s+scelta\s+degli\s+operatori\s+economici'
        - '\balbo\s+(degli\s+)?(operatori|fornitori)'
        - '(formazione|selezione|aggiornamento)\s+(dell.\s*|di\s+un\s+)?elenc\w*\s+(degli\s+)?operatori\s+economici'
        - '\bselezione\s+operatori\s+economici\b'
        - 'avviso\s+agli\s+operatori\s+economici'
      timeout_connessione: 20        # fonte nuova: se bloccasse GitHub, si perde poco tempo
      tentativi: 1

# --- Piattaforme Maggioli PortaleAppalti ("Appalti & Contratti") ------------------------
# Marche (23/11/2026). Ogni azienda sanitaria ha la sua istanza, con gli stessi percorsi: due elenchi
# pubblici (gare in corso e avvisi pubblici in corso) letti con un GET, 100 voci per pagina, senza
# login (vedi scout/maggioli.py). Niente CPV ne' CIG nell'elenco: filtro testuale. Le schede delle
# gare hanno un captcha (Friendly Captcha): non si leggono, il link e' per la persona che apre la
# dashboard. Le schede degli avvisi si aprono normalmente.
# Opzioni per sito: host, liste (bandi, avvisi), stazioni (codici del menu "Stazione appaltante",
# solo per le istanze multi-ente: una lettura per codice), escludi_titoli_regex, escludi_tipologie,
# escludi_stazioni_regex, enti_rinomina, ente_se_vuoto, pubblicazione_max_giorni (default 120: gli
# avvisi senza scadenza piu' vecchi si ignorano e si tolgono dallo storico), timeout_connessione,
# tentativi. I nomi degli enti restano quelli delle stazioni appaltanti, identici a quelli di TED
# (ricognizione del 23/11/2026), cosi' la deduplica fonde la stessa procedura vista nei due posti.
maggioli:
  # Per disattivare tutte le piattaforme Maggioli: false (i blocchi restano pronti).
  abilitato: true
  siti:
    # GT-SUAM, piattaforma della Regione (Maggioli, sorgenti acquisiti dalla Regione) e di altri 197
    # enti marchigiani. Si legge tutta, senza filtro per stazione: in corso al 23/11/2026 5 gare e 10
    # avvisi, tutti della "Regione Marche" (che e' anche il nome della SUAM). Gli enti non sanitari
    # passano il filtro solo con un oggetto sanitario, come su SardegnaCAT.
    - &maggioli_marche
      nome: GT-SUAM
      nome_fonte: GT-SUAM
      sigla: gtsuam
      regione: Marche
      host: "https://appaltisuam.regione.marche.it"
      liste: [bandi, avvisi]
      # Gli elenchi di operatori economici (albi dei fornitori) non sono opportunita'.
      escludi_tipologie: [Elenco operatori economici]
      escludi_stazioni_regex:
        - '\btest\b'                  # "UFF. TEST", "UFFICIO TEST", "Ufficio intestatario di TEST"
      escludi_titoli_regex: &escludi_maggioli
        # Affidamenti diretti e richieste di preventivo (l'elenco non ha il tipo di procedura): regola
        # di GIADA e SardegnaCAT sull'inizio del titolo. Le indagini "finalizzate all'affidamento
        # diretto" e "per individuare gli operatori da invitare" restano: sono aperte a tutti.
        - '^\W*(?:(?:bando\s+(?:rettificato|revocato|in\s+rettifica)|procedura\s+(?:ripristinata|sospesa|in\s+sospensione)|riapertura\s+termini|ADP?)\s*[-\u2013]\s*)*(?:affidamento\s+diretto|affidamento(?:\s+(?:della\s+)?fornitura)?\W*\s*(?:ai\s+sensi\s+dell|di\s+cui\s+all|ex)\W*\s*art\W*\s*(?:n\W*\s*)?50\W*\s*(?:c(?:o|omma)\W*\s*)?1\W*\s*(?:lett\w*\W*\s*)?[ab]\b|richiesta\s+(?:di\s+)?preventivo)'
        # AST Ascoli pubblica negli avvisi anche gli affidamenti gia' fatti ("ACQ - Scheda di
        # aggiudicazione - ...", tra cui licenze software Lexroom e Sapient) e le aste dei veicoli;
        # l'AOU la vendita di un autocaravan.
        - 'scheda\s+di\s+aggiudicazion|\baggiudicazione\s+definitiv|\besito\s+(di\s+|della\s+)?(gara|procedura)'
        - '\basta\s+pubblica|\bvendita\b|\balienazion'
      # Primo lancio (23/11/2026, run 45189892369): ConnectTimeout da GitHub su tutte le 8 piattaforme
      # (20 s e un nuovo tentativo per lista: 8 minuti in piu'), mentre dal computer dell'utente
      # rispondono. Seconda prova all'esecuzione automatica del giorno dopo (lezione 41) con attesa
      # breve, nessun nuovo tentativo e, dopo il primo timeout, nessuna altra lista dello stesso sito:
      # circa 10 secondi per sito. Se fallisce di nuovo: abilitato: false in QUESTO blocco (lo ereditano
      # le altre sette piattaforme marchigiane) e controllo manuale. Non nella sezione maggioli: dal
      # 23/11/2026 comprende anche le istanze siciliane, che hanno un blocco modello proprio.
      timeout_connessione: 10
      tentativi: 0
    # AST Ancona: due stazioni, l'AST e "Azienda Sanitaria Territoriale di Ancona - Soggetto Aggregatore
    # in avvalimento per Regione Marche" (le gare SSR del soggetto aggregatore SUAM: su TED dosimetria
    # per le AST, manutenzione software). Al 23/11/2026 nessuna gara in corso.
    - <<: *maggioli_marche
      nome: AST Ancona
      nome_fonte: Appalti AST Ancona
      sigla: astan
      host: "https://appalti-ast2an.sanita.marche.it"
    # AST Pesaro Urbino: usa GTAOMN, la piattaforma dell'ex AO Marche Nord. Le stazioni hanno nomi di
    # uffici: "UOC Acquisti e Logistica" resta cosi' (e' il nome su TED, riconosciuto come sanitario dalla
    # regola sulle UOC), gli altri prendono il nome dell'azienda.
    - <<: *maggioli_marche
      nome: AST Pesaro Urbino (GTAOMN)
      nome_fonte: GTAOMN AST Pesaro Urbino
      sigla: astpu
      host: "https://gtaomn.regione.marche.it"
      enti_rinomina:
        "Farmacia": "AST Pesaro Urbino - Farmacia"
        "Servizio Tecnico": "AST Pesaro Urbino - Servizio Tecnico"
      ente_se_vuoto: AST Pesaro Urbino
    - <<: *maggioli_marche
      nome: AST Macerata
      nome_fonte: Appalti AST Macerata
      sigla: astmc
      host: "https://appalti-ast3mc.sanita.marche.it"
    - <<: *maggioli_marche
      nome: AST Fermo
      nome_fonte: Appalti AST Fermo
      sigla: astfm
      host: "https://appalti-ast4fm.sanita.marche.it"
    # AST Ascoli Piceno: negli avvisi "in corso" (46 al 23/11/2026) soprattutto schede di
    # aggiudicazione e aste di veicoli, escluse dalle regole comuni.
    - <<: *maggioli_marche
      nome: AST Ascoli Piceno
      nome_fonte: Appalti AST Ascoli Piceno
      sigla: astap
      host: "https://appalti-ast5ap.sanita.marche.it"
    # AOU delle Marche (GTAOAN): gare e avvisi (indagini, consultazioni preliminari, infungibilita'),
    # come dice la pagina "Bandi di gara e contratti" del suo PAT, che quindi non si legge.
    - <<: *maggioli_marche
      nome: AOU delle Marche (GTAOAN)
      nome_fonte: GTAOAN AOU delle Marche
      sigla: aoumarche
      host: "https://gtaoan.regione.marche.it"
    # GTMULTIE: piattaforma di 113 enti, quasi tutti comuni. Si leggono solo INRCA (000033, tutte le sue
    # gare, anche dei presidi di Casatenovo e Cosenza) e ARS Marche (000005). Se il server ignorasse il
    # filtro per stazione, la lista viene scartata con un errore: in quel caso togliere "stazioni".
    - <<: *maggioli_marche
      nome: GTMULTIE (INRCA e ARS)
      nome_fonte: GTMULTIE
      sigla: gtmultie
      host: "https://gtmultie.regione.marche.it"
      stazioni: ["000033", "000005"]
    # ------------------------------------------------------------------------------------------
    # Sicilia (23/11/2026). Non c'e' una piattaforma regionale per la sanita': 11 aziende usano
    # ciascuna una propria istanza Maggioli PortaleAppalti (ricognizione dell'utente: liste in corso,
    # totali, ultima procedura, stazioni appaltanti). Qui le 9 che rispondono con la catena TLS
    # completa; ARNAS Civico (manca l'intermedio Sectigo, scout/tls.py da correggere) e AO Papardo
    # (intermedio Actalis non scaricabile) restano fuori per ora. I nomi degli enti sono quelli delle
    # stazioni appaltanti, identici a TED (per la deduplica). Blocco modello proprio, NON quello delle
    # Marche: se le Marche vanno disattivate (abilitato: false nel loro primo blocco, che le altre
    # Marche ereditano), la Sicilia resta attiva. Stesse attese brevi delle Marche (10 s, nessun nuovo
    # tentativo): se un host non risponde ai server di GitHub costa una riga e 10 secondi (lezione 83).
    - &maggioli_sicilia
      nome: ASP Palermo
      nome_fonte: Appalti ASP Palermo
      sigla: asppalermo
      regione: Sicilia
      host: "https://portaleappalti-asppalermo.maggiolicloud.it"
      liste: [bandi, avvisi]
      escludi_tipologie: [Elenco operatori economici]
      escludi_stazioni_regex:
        - '\btest\b'
      escludi_titoli_regex: *escludi_maggioli
      timeout_connessione: 10
      tentativi: 0
    # ASP Caltanissetta: il vecchio indirizzo alice-web.omniars.it (ancora nei link TED) reindirizza qui.
    # Nella stessa istanza anche "Amministrazione Consorziata - Azienda Sanitaria Provinciale di Palermo"
    # e il Conservatorio di Caltanissetta (non sanitario: entra solo con un oggetto sanitario).
    - <<: *maggioli_sicilia
      nome: ASP Caltanissetta
      nome_fonte: Appalti ASP Caltanissetta
      sigla: aspcaltanissetta
      host: "https://portaleappalti-aspcaltanissetta.maggiolicloud.it"
    - <<: *maggioli_sicilia
      nome: ASP Messina
      nome_fonte: Appalti ASP Messina
      sigla: aspmessina
      host: "https://aspmessina-appalti.maggiolicloud.it"
    # ASP Trapani: solo le gare. I 740 avvisi "in corso" (verificati dall'utente il 23/11/2026, 8 pagine)
    # sono un archivio di pubblicazioni di trasparenza su acquisti gia' decisi dal 2017 (trattative
    # dirette e RdO MePA, acquisti urgenti, ausili e farmaci per singoli pazienti), con lo stato mai
    # chiuso: 0 pertinenti con le regole attuali, 6 voci con scadenza futura, nessuna IT. Leggerli
    # darebbe 100 voci di rumore e ogni giorno l'avviso "lette 100 su 740: dati parziali".
