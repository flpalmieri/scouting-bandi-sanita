        "Area sociosanitaria locale 2": "ATS Liguria - Area sociosanitaria 2 Savonese"
        "Area sociosanitaria locale 3": "ATS Liguria - Area sociosanitaria 3 Genovese"   # = ente di "ASL 3 consultazioni"
