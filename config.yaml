      # pubblica (inviti e affidamenti): gli avvisi aperti a tutti li pubblica sul proprio sito.
      nome_fonte: ULSS 6 Euganea
      sigla: ulss6
      ente: Azienda ULSS 6 Euganea
      regione: Veneto
      lettore: it_card
      # 18/11/2026: dai server di GitHub la connessione va in timeout (dal browser in Italia
      # il sito risponde). Prova con attesa breve: se fallisce ancora, mettere abilitato: false
      # e controllare a mano https://www.aulss6.veneto.it/bandi-di-gara?stato=1 una volta al mese.
      timeout_connessione: 15
      tentativi: 1
      # Solo lo stato "Pubblicato" (stato=1), 10 schede per pagina, dalla piu' recente.
      url: "https://www.aulss6.veneto.it/bandi-di-gara?stato=1&p={pagina}"
      max_pagine: 5
      # Elenco misto: affidamenti a una ditta, aggiudicazioni e adesioni a gare
      # centralizzate (Consip, Azienda Zero) non sono opportunita'.
      escludi_titoli_regex:
        - '^\s*affidamento\b'
        - '\balla\s+ditta\b'
        - '\baggiudicazion'
        - 'presa\s+d.atto'
        - '\badesione\b'
      # La "Scadenza" del sito e' la fine della pubblicazione (31/12/2031, 01/01/2032).
      scadenza_max_giorni: 365
    - nome: ASL TO5
      abilitato: false               # 20/11/2026 (commit c2e18e1): timeout da GitHub il 19 e il 20/11; controllo manuale mensile
      # Piemonte. Le procedure su Sintel sono quasi tutte non visibili pubblicamente (inviti);
      # richieste di preventivo e avvisi aperti stanno sul portale bandi dell'ASL (Drupal).
      nome_fonte: ASL TO5
      sigla: aslto5
      ente: ASL TO5
      regione: Piemonte
      lettore: teaser_drupal
      # Ultime 3 pagine da 10 (ordine per pubblicazione); le pagine contano da 0.
      url: "https://bandi.aslto5.piemonte.it/bandi-appalti?page={pagina}"
      pagina_iniziale: 0
      max_pagine: 3
      escludi_stati: [Scaduto, Aggiudicato, Archiviato]
      # Il server non invia il certificato intermedio (Sectigo): vedi scout/tls.py.
