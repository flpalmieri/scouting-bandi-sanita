# =====================================================================
#  Scouting bandi software / IT in ambito sanitario - configurazione
# =====================================================================

# --- Filtro CPV --------------------------------------------------------
# Un avviso passa il filtro CPV se almeno uno dei suoi codici inizia con
# uno di questi prefissi (si confrontano solo le cifre, senza "-x").
cpv_prefissi:
  - "48"        # Pacchetti software e sistemi di informazione
  - "72"        # Servizi informatici: consulenza, sviluppo, Internet, supporto
  # - "302"     # Apparecchiature informatiche (decommenta se ti interessa l'hardware)
  # - "64216"   # Servizi di messaggistica e informazione elettronica

# CPV che vengono inclusi SEMPRE, anche se l'ente non risulta sanitario.
cpv_sempre_inclusi:
  - "48180000"  # Pacchetti software medici
  - "48814000"  # Sistemi di informazione medica

# --- Riconoscimento enti sanitari -------------------------------------
# Espressioni regolari (case-insensitive) sul nome della stazione appaltante.
enti_sanitari_regex:
  - '\bA\.?S\.?L\b'
  - '\bA\.?S\.?P\b'
  - '\bASST\b'
  - '\bATS\b'
  - '\bA\.?U\.?S\.?L\b'
  - '\bU\.?L\.?S\.?S\b'
  - '\bA\.?O\.?U\.?I?\b'                  # Azienda Ospedaliero-Universitaria (AOU, A.O.U., AOUI)
  - 'istituto\s+oncologic|\bIOV\b'     # Istituto Oncologico Veneto (IRCCS) anche senza la parola IRCCS
  - '\bA\.\s?O\.(?=\s)'                 # "A.O. ORDINE MAURIZIANO TORINO" (Azienda Ospedaliera)
  # Liguria (riforma dal 1/1/2026): ATS Liguria - Azienda Tutela della Salute (ex ASL 1-5 e
  # Liguria Salute / A.Li.Sa.), su Sintel come "AZIENDA TUTELA DELLA SALUTE LIGURIA"; Gaslini
  # su Sintel come "ISTITUTO GIANNINA GASLINI" (senza IRCCS).
  - 'tutela\s+della\s+salute'
  - 'giannina\s+gaslini'
  - 'liguria\s+salute|\bA\.\s?Li\.\s?Sa\b'
  # Toscana (19/11/2026): nomi usati su START, sanita.start e TED.
  - 'unit[aà]?\W{0,2}\s*sanitari\w*\s+local'   # "AZIENDA UNITA' SANITARIA LOCALE TOSCANA CENTRO / SUD-EST"
  - '\bmonasterio\b'                           # Fondazione Toscana Gabriele Monasterio
  - '\bISPRO\b|rete\s+oncologica'               # Istituto per lo studio, la prevenzione e la rete oncologica
  - '\bsoc(iet[aà]|\.)\s*della\s+salute'         # Societa' della Salute (es. "COESO-SOC.DELLA SALUTE")
  # Emilia-Romagna (20/11/2026): su Intercent-ER l'IRCCS Rizzoli si chiama solo "ISTITUTO
  # ORTOPEDICO RIZZOLI" (15 voci aperte al 19/11/2026).
  - '\brizzoli\b|istituto\s+ortopedico'
  # Lazio (20/11/2026): nomi usati su STELLA (piattaforma regionale), senza la sigla IRCCS.
  - '\bI\.?F\.?O\b|istituti\s+fisioterapici'        # "I.F.O." (Regina Elena e San Gallicano)
  - '\bI\.?N\.?M\.?I\b|(istituto|malattie\s+infettive).{0,60}spallanzani'   # "I.N.M.I. Lazzaro Spallanzani" (non i licei omonimi)
  - '\bA\.?R\.?E\.?S\.?\s*118\b'                    # "A.R.E.S. 118" (emergenza sanitaria)
  # Campania (20/11/2026): su SIAPS (So.Re.Sa.) le aziende ospedaliere sono "A.O. CARDARELLI",
  # "A.O. DEI COLLI" ecc., gia' riconosciute; nei titoli compare pero' anche la sigla "A.O.R.N."
  # (Azienda Ospedaliera di Rilievo Nazionale), che senza questa regola non passava (es. su TED).
  - '\bA\.?O\.?R\.?N\b'
  # Friuli Venezia Giulia (20/11/2026): nomi usati su eAppaltiFVG (Jaggaer), scritti per esteso e
  # senza IRCCS. ASUGI e ASUFC erano gia' riconosciute (sigla e "azienda sanitaria"), come ASFO per
  # esteso; ARCS solo con la sigla. Si aggiungono il nome di ARCS senza sigla, la sigla ASFO (TED),
  # il CRO di Aviano ("CENTRO DI RIFERIMENTO ONCOLOGICO") e il Burlo Garofolo.
  - 'azienda\s+regionale\s+di\s+coordinamento\s+per\s+la\s+salute'
  - '\bASFO\b'
  - 'centro\s+di\s+riferimento\s+oncologico'
  - '\bburlo\b'
  # Sardegna (20/11/2026): nomi visti su TED e su SardegnaCAT. ARES (Azienda Regionale della Salute,
  # centrale di committenza della sanita' sarda dal 2022) su TED si scrive "azienda regionale della
  # salute (ARES)", "ARES SARDEGNA", "ARES Sardegna": nessuno era riconosciuto. "ARES" da sola non
  # basta (sarebbe un nome troppo comune): serve "Sardegna" accanto o il nome per esteso. Anche AREUS
  # (emergenza-urgenza, 118), la sigla ARNAS (Brotzu) e la sigla IZS. Non prendono AREA ("Azienda
  # Regionale Edilizia Abitativa"), ARPAS, ARST ne' l'"Azienda Regionale per lo Sviluppo del Territorio".
  - 'azienda\s+regionale\s+della\s+salute|\bARES\W{0,3}sardegna\b'
  - '\bA\.?R\.?E\.?U\.?S\b|azienda\s+regionale\s+dell\W?\s*emergenza'
  - '\bA\.?R\.?N\.?A\.?S\b|\bbrotzu\b'
  - '\bI\.?Z\.?S\b'
  # Marche (23/11/2026): l'INRCA su TED e su GTMULTIE si chiama "INRCA Istituto di Ricovero e Cura a
  # Carattere Scientifico": IRCCS scritto per esteso, che la regola \bIRCCS\b non prende (7 avvisi TED
  # dal 01/06/2026, 103 procedure su GTMULTIE). La forma estesa vale per ogni IRCCS.
  - 'istituto\s+di\s+ricovero\s+e\s+cura|\bI\.?N\.?R\.?C\.?A\b'
  # AST Pesaro Urbino pubblica su TED (22 avvisi dal 01/06/2026) e sulla sua piattaforma GTAOMN come
  # "UOC Acquisti e Logistica", senza il nome dell'azienda. UOC (Unita' Operativa Complessa) e' una
  # struttura delle aziende del SSN: un ente il cui nome INIZIA con UOC e' sanitario. Nei 532 avvisi
  # TED marchigiani e nei campioni delle altre fonti l'unico nome cosi' e' quello dell'AST PU.
  - '^\W*U\.?\s?O\.?\s?C\b'
  # Decisione di Flavio in attesa (23/11/2026): ARS Marche ("AGENZIA REGIONALE SANITARIA MARCHE" su
  # GTMULTIE, "AGENZIA REGIONALE SANITARIA" su GT-SUAM; mai acquirente su TED) come ente sanitario,
  # come ARES e AREUS in Sardegna. Al 23/11/2026 nessun suo avviso aperto e' IT (interpretariato
  # CUR 112, rete radio 118, campagna screening). Per attivarla: togliere il # dalla riga seguente.
  - 'agenzia\s+regionale\s+sanitaria'
  # Sicilia (23/11/2026): nomi visti su TED (937 avvisi siciliani dal 01/06/2026) e sulle piattaforme.
  # ASP, ARNAS, AO, AOU, Policlinici, IZS e "U.O.C. Provveditorato" (ARNAS Civico su TED) erano gia'
  # riconosciuti. Restavano fuori: la Fondazione Giglio di Cefalu' (104 avvisi TED, il buyer sanitario
  # siciliano piu' attivo), l'ISMETT scritto per esteso (IRCCS di diritto privato del SSR, come Gemelli e
  # Bambino Gesu' nel Lazio), l'IRCCS Bonino Pulejo scritto "I.R.C.C.S" con i punti (la sigla con i
  # punti vale per ogni IRCCS) e la SEUS 118 (Sicilia Emergenza-Urgenza Sanitaria, societa' consortile
  # del SSR). Non prendono la Fondazione Ri.MED (ricerca), ARPA Sicilia ne' i comuni (provato sui nomi).
  - 'istituto\s+g\W{0,2}\s*giglio|giglio\W+(di\s+)?cefal'
  - '\bI\.?S\.?M\.?E\.?T\.?T\b|istituto\s+mediterraneo\s+per\s+i\s+trapianti'
  - '\bI\.\s?R\.\s?C\.\s?C\.\s?S\b'
  - '\bS\.?E\.?U\.?S\b|emergenza\W+urgenza\s+sanitaria'
  # Decisione di Flavio (23/11/2026): l'Assessorato regionale della Salute, Dipartimento per la
  # pianificazione strategica e DASOE (Attivita' sanitarie e Osservatorio epidemiologico), e' ente
  # sanitario, come ARES in Sardegna: compra per il SSR (elisoccorso SUES 118, sistema informativo,
  # Connected Care). "Pianificazione strategica" solo con la Regione Siciliana o l'Assessorato della
  # Salute vicino: da sola e' anche il nome di uffici di comuni e universita'. Nomi visti: "Regione
  # siciliana - Dipartimento per la pianificazione strategica" (TED, SITAS), "ASSESSORATO DELLA SALUTE -
  # Dipartimento Regionale della Pianificazione Strategica" (vecchio portale CUC). Su TED dal 01/06/2026
  # 4 esiti dell'elisoccorso, nessuno IT: oggi nessun effetto sui dati.
  - '(regione\s+sicilian\w*|assessorato\s+(regionale\s+)?(della\s+)?salute)\W.{0,80}pianificazione\s+strategica|\bDASOE\b|attivit[aà]\s+sanitarie\s+e\s+osservatorio\s+epidemiologico'
  - '\bU\.?S\.?L\b'
  - '\bASU\s?(FC|GI)\b'
  - '\bAST\b'
  - '\bASUR\b'
  - '\bARCS\b'
  - '\bAREU\b'
  - '\bIRCCS\b'
  - 'azienda\s+(socio[\s-]?)?sanitari'
  - 'azienda\s+(universitari\w*\s+)?ospedalier'
  - 'ospedal'
  - 'policlinic'
  - 'istituto\s+zooprofilattico'
  - 'istituto\s+(nazionale\s+)?(dei\s+)?tumori'
  - 'azienda\s+zero'
  - '\bESTAR\b'
  - 'so\.?re\.?sa'
  - 'servizio\s+sanitario'
  - 'agenzia\s+regionale.*salute'

# Eccezioni alle regole qui sopra: enti che quelle regole prenderebbero per sanitari ma che
# non lo sono. Valgono solo per il nome dell'ente: una gara IT con un oggetto sanitario entra
# comunque. In Emilia-Romagna "ASP" e' l'Azienda di Servizi alla Persona (comunale, socio-
# assistenziale), non l'Azienda Sanitaria Provinciale siciliana o calabrese. Nomi verificati su
# Intercent-ER il 19/11/2026; altre ASP emiliane vanno aggiunte qui quando compaiono.
enti_non_sanitari_regex:
  - 'servizi\s+alla\s+persona'                     # "AZIENDA SERVIZI ALLA PERSONA DEL FORLIVESE"
  - 'citt[aà]\W?\s+delle\s+persone'                # "ASP REGGIO EMILIA - CITTA DELLE PERSONE"
  - '\bASP\W+(citt[aà]\W?\s+di\s+bologna|delia\s+repetto|del\s+delta\s+ferrarese)'
  - 'centrale\s+unica\s+di\s+committenza\s+dei\s+comuni'   # CUC comunali (una contiene "ASP DEL DELTA")
  # Friuli Venezia Giulia (20/11/2026): anche qui "ASP" e' l'Azienda Pubblica di Servizi alla Persona
  # (ex IPAB, case di riposo). Su eAppaltiFVG: "Azienda Pubblica di Servizi alla Persona - ASP ITIS"
  # (gia' esclusa dalla prima riga) e "ASP \"Daniele Moro\"" (Codroipo), che senza questa riga
  # passerebbe per azienda sanitaria. Le altre ASP friulane vanno aggiunte qui quando compaiono.
  - '\bASP\W+(daniele\s+moro|ITIS)\b'

# Frasi che descrivono il CANALE della gara, non il suo oggetto: vengono ignorate
# prima di cercare le parole IT (altrimenti "affidamento su piattaforma telematica
# GIADA" di un farmaco sembrerebbe una gara informatica).
rumore_procedurale_regex:
  # Dal 23/11/2026 (Sicilia) anche "lutilizzo" senza apostrofo: TED e le piattaforme Maggioli siciliane
  # perdono gli apostrofi ("laffidamento", "dellart."), e "Procedura di gara mediante lutilizzo della
  # piattaforma telematica di e-procurement" (AO Papardo, TED 767590 e Maggioli G05980) entrava come IT.
  - '(su|sulla|tramite|mediante|attraverso|nella|con)\s+(ricorso\s+a(lla)?\s+|(l[\x27\u2019]?\s*)?utilizzo\s+(della\s+)?)?(la\s+|l[\x27\u2019]\s*)?(propria\s+)?piattaforma\s+((web|telematica|informatica|digitale|elettronica|regionale|aziendale|e-?procurement|di\s+e-?procurement|di\s+negoziazione)\s+)*([A-Z][\w\.\-]*)?'
  - '\b(RDO|trattativa\s+diretta|ODA)\s+(su\s+)?(il\s+)?MePA\b'
  - 'procedura\s+(aperta\s+|negoziata\s+|ristretta\s+)?(telematica|informatizzata)'
  # Sintel come canale di gara: "sistema informatico di negoziazione Sintel", "piattaforma
  # informatica regionale Sintel". Parole intermedie solo da questo elenco chiuso, cosi'
  # "sistema informativo ospedaliero tramite Sintel" resta IT.
  - '\b(piattaforma|sistema)\s+((informatic[oa]|telematic[oa]|elettronic[oa]|digitale|regionale|di|del|della|negoziazione|e-?procurement|acquisti|denominat[oa]|aria|lombard[oa])\s+){0,5}["“«]?sintel\b'
  # SIAPS di So.Re.Sa. (Campania) come canale di gara: "tramite il sistema informatico per le
  # procedure telematiche di acquisto di So.Re.Sa. “SIAPS Sistema Informativo Appalti Pubblici
  # Sanità”" faceva entrare come IT forniture di dispositivi (protesi discali, aspiratori).
  - 'sistema\s+informatico\s+per\s+le\s+procedure\s+telematiche\s+di\s+acquist\w*'
  - '(SIAPS\W{0,3})?sistema\s+informativo\s+appalti\s+pubblici(\s+(in\s+)?sanit\w*)?'
  # Strumenti di laboratorio "su due postazioni di lavoro" (ASL 7 Sulcis, diagnostica molecolare PCR,
  # 20/11/2026): il numero di postazioni di uno strumento non e' una fornitura di PC.
  - '\bsu\s+(una|due|tre|quattro|cinque|sei|\d+)\s+(sol[ae]\s+)?postazion\w*\s+di\s+lavoro'
  # Nome del reparto che compra, non oggetto (Abruzzo, 23/11/2026): "stampanti termiche per etichette
  # Zebra ... U.O.S.D. Servizio Sistemi Informativi" (GIADA 346096, ASL 1) entrava come IT per
  # "sistemi informativi". Solo dopo la sigla dell'unita' operativa: "licenze software per la UOC
  # Sistemi Informativi" resta IT per "software", "sistema informativo ospedaliero" resta IT.
  - '\bU\.?\s?O\.?\s?(S\.?\s?D\.?|C\.?|S\.?)?\s+(servizio\s+)?sistemi\s+informativ\w*'
  # Formula fissa delle consultazioni DigitalPA dell'IZSAM (23/11/2026): "La funzione «Manifestazione
  # di interesse» e' utilizzata esclusivamente quale strumento informatico per consentire agli operatori
  # ..." faceva entrare come IT una consultazione su kit diagnostici ELISA (izsam:10293).
  - '(quale|come)\s+strument\w*\s+informatic\w*'

# Soggetti aggregatori che comprano sia per la sanità sia per altri settori:
# le loro gare IT vengono incluse ma marcate "da verificare".
aggregatori_misti_regex:
  - 'intercent'
  - '\bARIA\b'
  - 'azienda\s+regionale\s+per\s+l.innovazione\s+e\s+gli\s+acquisti'
  - '\bconsip\b'
  - 'innova\s*puglia'
  - 'punto\s*zero'                     # Umbria: compra per la sanità ma anche per la Regione
  - 'areacom|agenzia\s+regionale\s+dell.abruzzo\s+per\s+la\s+committenza'   # Abruzzo: sanità, Regione e comuni
  - '\bSCR\s+piemonte\b|societ.\s+di\s+committenza\s+regione\s+piemonte'   # Piemonte: soggetto aggregatore (sanità e Regione)
  # Decisione di Flavio (19/11/2026): societa' informatiche e centrali regionali che comprano
  # anche per la sanita'. Le loro gare IT (TED, Sintel) entrano "da verificare".
  - '\bCSI[\s-]*piemonte\b|consorzio\s+per\s+il\s+sistema\s+informativo'   # Piemonte: consorzio informatico regionale
  - 'liguria\s+digitale'                                                    # Liguria: societa' informatica della Regione
  # SUAR Liguria: solo con la sigla o con "Liguria" vicino, per non includere le stazioni
  # uniche appaltanti di altre regioni (es. SUA-RB Basilicata).
  - '\bS\.?U\.?A\.?R\b|stazione\s+unica\s+appaltante\s+regional\w*.{0,60}liguri|liguri\w*.{0,60}stazione\s+unica\s+appaltante'
  # Decisione di Flavio (19/11/2026): Regione Toscana (anche come soggetto aggregatore) compra
  # IT per tutte le PA toscane, sanita' compresa. Le sue gare IT entrano "da verificare".
  - '\bregione\s+toscana\b|giunta\s+regionale\s+(della\s+)?toscana'
  # Emilia-Romagna: Intercent-ER e' gia' coperta da 'intercent' (prima riga). Decisione di Flavio
  # (20/11/2026): anche Lepida (societa' informatica della Regione, come CSI Piemonte e Liguria
  # Digitale) e ART-ER (societa' consortile regionale per ricerca e innovazione). Le loro gare IT
  # entrano "da verificare", anche quelle non sanitarie.
  - '\blepida\b'
  - '\bART-ER\b'
  # Friuli Venezia Giulia: decisione di Flavio (20/11/2026). La Centrale unica di committenza della
  # Regione (su eAppaltiFVG "Centrale unica di committenza FVG") compra per il SSR (farmaci, aghi e
  # siringhe) e per gli enti locali: le sue gare IT entrano "da verificare". Solo per nome: non
  # prende la "CENTRALE COMMITTENZA RETE DELLE STAZIONI APPALTANTI DEL FRIULI VENEZIA GIULIA" ne'
  # le CUC dei comuni ("CUC SACILE, BRUGNERA E CANEVA"). Insiel resta fuori (decisione di Flavio).
  - 'centrale\s+unica\s+di\s+committenza\s+(della\s+)?(FVG|regione\s+(autonoma\s+)?friuli)|friuli\s+venezia\s+giulia.{0,80}centrale\s+unica\s+di\s+committenza'
  # Sardegna: decisioni di Flavio (20/11/2026). (1) La Centrale regionale di committenza (soggetto
  # aggregatore, compra anche per la sanita': es. "Farmaci" DPCM 2026) non pubblica con un nome suo:
  # su TED e su SardegnaCAT e' sempre "Regione Autonoma della Sardegna", come le altre direzioni
  # regionali. Si prende quindi la Regione, solo quando il nome dell'ente INIZIA cosi' (non le
  # agenzie "... della Regione Autonoma della Sardegna"), piu' il nome della Centrale se un giorno
  # comparisse. Le gare IT della Regione entrano "da verificare" anche se non sanitarie (TED 2026:
  # 7 avvisi IT, nessuno sanitario). (2) Sardegna IT, societa' informatica della Regione, come Lepida
  # e CSI Piemonte.
  - '^\W*regione\s+(autonoma\s+)?(della\s+)?sardegna\b|centrale\s+regionale\s+di\s+committenza\W+(della\s+)?(regione\s+)?(autonoma\s+)?(della\s+)?sardegna'
  - '\bsardegna\s*IT\b'
  # Marche: decisione di Flavio in attesa (23/11/2026). La SUAM (Stazione Unica Appaltante, soggetto
  # aggregatore) non ha un nome suo: su GT-SUAM e quasi sempre su TED e' "Regione Marche", lo stesso
  # nome delle gare della Giunta (RUNTS, rete meteo, protezione dati); su TED a volte "settore SUAM -
  # Soggetto Aggregatore". La riga prende la Regione solo se il nome dell'ente INIZIA cosi' (non
  # "Consiglio regionale - Assemblea legislativa delle Marche"), piu' la sigla SUAM. Le gare sanitarie
  # della SUAM le svolge l'AST Ancona ("... - Soggetto Aggregatore in avvalimento per Regione
  # Marche"), gia' ente sanitario. Effetto sui dati dal 01/06/2026: entrano "da verificare" 3 gare
  # TED (SF 28/26 controlli sviluppo rurale, SF 20/2026 sistema informativo, SF37/2026 abbonamenti e
  # software, quest'ultima anche su GT-SUAM) e l'avviso GT-SUAM A00252 (MISU degli sportelli unici),
  # nessuna sanitaria. Le due consultazioni sanitarie della Regione (screening prenatale, NuCDR)
  # entrano gia' per l'oggetto. Per attivarla: togliere il # dalla riga seguente.
  - '^\W*regione\s+marche\b|\bSUAM\b'
  # Sicilia: decisioni di Flavio (23/11/2026). (1) Sicilia Digitale, societa' informatica
  # della Regione, come Lepida e CSI Piemonte (su TED 2 avvisi dal 01/06/2026, rilevamento incendi,
  # nessuno IT sanitario). (2) L'Ufficio Speciale Centrale Unica di Committenza per l'acquisizione di
  # beni e servizi (compra per il SSR: farmaci, vaccini, elisoccorso), solo con il suo nome: su TED
  # non compare dal 01/06/2026, le sue gare si svolgono su Consip. Oggi nessun effetto sui dati.
  # Non prendono la CUC lavori del Dipartimento Regionale Tecnico ne' le CUC dei comuni.
  - '\bsicilia\s+digitale\b'
  - 'centrale\s+unica\s+di\s+committenza\s+per\s+l\W?\s*acquisizione\s+di\s+beni\s+e\s+servizi|centrale\s+unica\s+di\s+committenza\s+(della\s+)?regione\s+siciliana'

# Parole chiave sul titolo/oggetto che indicano un contesto sanitario
# (servono per enti non sanitari, es. una Regione che compra un sistema FSE).
parole_chiave_sanita_regex:
  - 'sanitari'
  - 'ospedal'
  - 'clinic'
  - 'tele\W?medicin'
  - 'tele\W?monitor'
  - 'tele\W?consult'
  - 'fascicolo\s+sanitario'
  - '\bFSE\b'
  - 'cartella\s+clinica'
  - '\bRIS\b'
  - '\bPACS\b'
  - '\bLIS\b'
  - 'centro\s+unic\w*\s+(di\s+)?prenotazion'   # NB: non usare "CUP", collide con il Codice Unico di Progetto
  - 'prenotazion\w*\s+(delle\s+)?(prestazion|visite|esami)'
  - 'pronto\s+soccorso'
  - 'farmac'
  - 'pazient'
  - 'ricoveri'
  - 'ambulatori'
  - 'dossier\s+sanitario'
  - 'medicina\s+(generale|territoriale)'
  - 'case\s+della\s+comunit'
  - 'centrali\s+operative\s+territoriali|\bCOT\b'
  # Marche (23/11/2026): "sistema informativo a supporto della rete dello screening prenatale ... Enti
  # del SSR" (Regione Marche, GT-SUAM A00251 e TED 795909) non aveva parole sanitarie. Nei campioni
  # delle altre fonti "screening" compare solo in oggetti di enti gia' sanitari, "SSR" mai.
  - '\bscreening\b'
  - '\bS\.?S\.?R\b'

# Parole chiave informatiche: servono per le fonti senza CPV (feed RSS dei
# portali regionali), dove l'oggetto IT si riconosce solo dal testo.
# Dal 20/11/2026 "tele\W?medicin", "tele\W?consult", "tele\W?monitor" prendono anche le grafie con
# trattino o spazio ("Tele-monitoraggio" nell'albo dell'ASL 3 Nuoro), qui e tra le parole sanitarie.
parole_chiave_it_regex:
  - 'software'
  - 'informatic'
  - 'informatizzat'                    # "soluzione informatizzata" (AO Padova su Sintel)
  - 'applicativ'
  - 'gestional'
  - 'sistem\w*\s+informativ'
  - 'piattaforma\s+(digitale|informatica|telematica|software|web|regionale)'
  - 'licenz\w*\s+(d.uso|software)'
  - '\blicenze\b'
  - '\bcloud\b'
  - 'data\s*center'
  - 'cyber'
  - 'anti-?virus|anti-?spam|anti-?malware|firewall|endpoint'
  - 'sicurezza\s+informatica'
  - 'threat\s+intelligence|\bddos\b|deep\s+web|dark\s+web|\bSIEM\b|vulnerability|penetration\s+test'
  - 'subscription'                     # rinnovi di abbonamenti software (es. "subscription WSO2")
  - 'full\s+managed|managed\s+(service|security)'
  - 'middleware|api\s+(gateway|management)'
  - '\bLIMS\b|laboratory\s+information|information\s+management\s+system'   # sistemi informativi di laboratorio (IZS)
  - '\bHW\s*/\s*SW\b'                  # "sistemi HW/SW" (consultazioni ESTAR)
  - 'digitalizzazion'
  # Abruzzo (23/11/2026): "piattaforma di archivio digitale delle cartelle sanitarie" (ASL 3 Pescara,
  # GIADA 361686) non conteneva nessuna parola IT. Anche la conservazione digitale/sostitutiva dei documenti.
  - 'archivi\w*\s+(digital|elettronic|informatic)'
  - 'conservazione\s+(digitale|sostitutiva|a\s+norma)'
  - 'dematerializzazion'
  - 'interoperabilit'
  - 'tele\W?medicin'
  - 'tele\W?consult'
  - 'tele\W?monitor'
  - 'fascicolo\s+sanitario'
  - 'cartella\s+clinica'
  - '\bPACS\b'
  - '\bRIS\b'
  - '\bLIS\b'
  - '\bERP\b'
  - 'intelligenza\s+artificiale'
  - 'postazioni\s+di\s+lavoro'
  - 'rete\s+dati|networking'
  - 'manutenzione\s+(correttiva|evolutiva|adeguativa)'
  - '\bICT\b'
  - '\bIT\s+service'
  - '\bSaaS\b'
  - 'portale\s+web'
  - '\bapp\b'
  # Sicilia (23/11/2026): "Fornitura di una piattaforma integrata per la gestione dell'informazione
  # clinica, la codifica semi-automatica delle dimissioni..." (Villa Sofia-Cervello, Maggioli G08820,
  # TED 744682 con CPV 48300000) non aveva parole IT: sulla piattaforma, senza CPV, si perdeva. Non si
  # usa "piattaforma integrata", che su TED siciliano compare anche per il trattamento dei rifiuti.
  - 'informazion[ei]\s+clinic|codifica\s+(semi\W?)?automatic'

# Esclusioni: se il titolo contiene una di queste, l'avviso viene scartato.
esclusioni_regex:
  - 'pulizi'
  - 'ristorazion'
  - 'lavanderi'
  - 'vigilanza\s+armata'
  - '\bausili'                                # ausili per pazienti (es. software di ingrandimento)
  - 'assistit[oa]\s+[A-Z]\.\s*[A-Z]\.'          # forniture nominative "assistito M.B."

# --- TED (Tenders Electronic Daily) -----------------------------------
ted:
  abilitato: true
  url: "https://api.ted.europa.eu/v3/notices/search"
  finestra_giorni: 10          # quanti giorni indietro guardare a ogni esecuzione
                               # (per recuperare lo storico alzalo a 90 per un lancio, poi riportalo a 10)
  max_pagine: 40               # 250 avvisi per pagina
  # Tipi di avviso da tenere (prefissi): cn = bando, pin = preinformazione.
  # Aggiungi "can" per raccogliere anche le aggiudicazioni.
  tipi_avviso_prefissi: ["cn", "pin"]
  campi:
    - publication-number
    - publication-date
    - notice-title
    - buyer-name
    - classification-cpv
    - deadline-receipt-tender-date-lot
    - notice-type
    - estimated-value-lot
    - links

# --- ANAC open data (dataset CIG) -------------------------------------
anac:
  abilitato: false              # dati CIG 2026 non ancora pubblicati
  base_url: "https://dati.anticorruzione.it/opendata"
  dataset_pattern: "cig-{anno}"    # id del dataset CKAN, un dataset per anno
  mesi_da_elaborare: 2             # al primo avvio, quanti file mensili recenti leggere
  solo_aperte: true                # tieni solo gare con scadenza offerta futura
  includi_senza_scadenza: false
  # Se l'API del portale risponde 403, lo script prova a scaricare direttamente
  # i file mensili con questo modello di indirizzo. Lascia vuoto se non serve.
  # Per compilarlo: apri il dataset CIG sul portale ANAC dal browser e copia il
  # link di download di un file mensile, sostituendo anno e mese con {anno} e {mese}.
  url_file_pattern: ""

