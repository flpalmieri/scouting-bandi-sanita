        importo: [a_base_asta]
        cig: [CIG]
        cpv: [CPV]
        stato: [statoFunzionale]
        id: [IdMsg]
      url: "https://eproc.empulia.it/portale/rss_new.asp?Table=DASHBOARD_VIEW_DOCUMENTI_PUBBLICI_BANDO_CONSULTAZIONI&FilterHide=&Filter=&ML_KEY=TEMPLATE_RSS_DPCM_BANDO_CONSULTAZIONE_ML&sort=DtScadenzaBandoTecnical&sortorder=desc&numRowForPag=20&nPag={pagina}"

    - nome: AURA bandi
      nome_fonte: A.U.R.A.
      sigla: aura
      regione: Umbria
      tipo: bando
      max_pagine: 5
      escludi_stati: [Revocato, Annullato]
      campi:                      # nomi dei campi afs: del feed (senza prefisso)
        titolo: [Oggetto, TitoloDocumento]
        descrizione: [TitoloDocumento]
        ente: [DenominazioneEnte, EnteProponente]
        scadenza: [DtScadenzaBandoTecnical]
