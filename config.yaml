# --- Siti che pubblicano i bandi solo come pagine HTML ---------------------
# lettore: il modello di pagina (vedi scout/portali_html.py).
# ente: nome dell'ente, usato quando la pagina non lo riporta per ogni bando.
portali_html:
  abilitato: true
  siti:
    - nome: USL Umbria 1
      nome_fonte: USL Umbria 1
      sigla: uslumbria1
      ente: USL Umbria 1
      regione: Umbria
      lettore: scheda_sito
      max_pagine: 5
      url: "https://www.uslumbria1.it/bandi-di-gara/?pagenumber={pagina}"
    - nome: USL Umbria 2
      nome_fonte: USL Umbria 2
      sigla: uslumbria2
      ente: USL Umbria 2
      regione: Umbria
      lettore: tabella
      # Solo la prima pagina (15 avvisi più recenti): le successive richiedono
      # un postback ASP.NET. In alternativa esiste il feed
      # https://www.uslumbria2.it/feeds/bandi-di-gara-e-contratti.rss
      url: "https://www.uslumbria2.it/pagine/bandi-di-gara-e-contratti"
    - nome: AO Perugia
      nome_fonte: AO Perugia
      sigla: aoperugia
      ente: Azienda Ospedaliera di Perugia
      regione: Umbria
      lettore: box_etichette
      # Solo la prima pagina (8 avvisi più recenti): le successive richiedono un postback ASP.NET.
      url: "https://www.ospedale.perugia.it/pagine/bandi-di-gara-e-contratti"
    - nome: AO Terni
      nome_fonte: AO Terni
      sigla: aoterni
      ente: Azienda Ospedaliera Santa Maria di Terni
      regione: Umbria
      lettore: scheda_sito            # stesso tema di USL Umbria 1
      max_pagine: 3                   # 12 schede per pagina, circa 5 settimane per pagina
      # L'elenco mescola avvisi e atti (delibere/determine di nomina commissione o
      # aggiudicazione): questi ultimi non sono opportunità e si scartano.
      escludi_titoli_regex:
        - '^\s*(delibera|deliberazione|determina|determinazione)\b'
      # Per gli atti il sito indica come "SCADENZA" la fine della pubblicazione (5 anni).
      scadenza_max_giorni: 365
      url: "https://www.aospterni.it/bandi-di-gara-e-contratti/?pagenumber={pagina}"
    - nome: IZS Umbria e Marche
      # DISATTIVATO (13/11/2026): i portali PAT di ISWEB rispondono 403 ai server di
      # GitHub, anche sull'indirizzo internetsoluzioni.it. Scelta: non aggirare il blocco.
      abilitato: false
      nome_fonte: IZSUM
      sigla: izsum
      ente: Istituto Zooprofilattico Sperimentale dell'Umbria e delle Marche
      regione: Umbria
      lettore: tabella                # portale PAT di ISWEB: colonne Oggetto / Data avviso
      # Pagina "Avvisi" (consultazioni e indagini di mercato): circa 10 avvisi l'anno,
      # tutti in una pagina. L'elenco non riporta la scadenza.
      url: "https://trasparenza.izsum.it/page/588/avvisi.html"
      # trasparenza.izsum.it risponde 403 da GitHub Actions (12/11/2026): stesso portale
      # sul server di ISWEB, verificato dal browser.
      url_alternativo: "https://izsum.internetsoluzioni.it/page/588/avvisi.html"
    - nome: AreaCom Abruzzo
      nome_fonte: AreaCom
      sigla: areacom
      ente: AreaCom - Agenzia regionale dell'Abruzzo per la Committenza
      regione: Abruzzo
      lettore: tabella                # Drupal: colonne Bando / Tipo di appalto / CIG / Data pubblicazione
      pagina_iniziale: 0              # le pagine partono da ?page=0
      max_pagine: 3                   # 15 bandi per pagina, circa 5 settimane per pagina
      # Elenco misto: gare per ASL e ASR, ma anche lavori per i comuni e avvisi di ricorsi.
      escludi_titoli_regex:
        - '^\s*ricors'
      url: "https://areacom.eu/bandi-gara-aperti?page={pagina}"
    - nome: ASL 1 Abruzzo
      # DISATTIVATO (13/11/2026): portale PAT di ISWEB, 403 dai server di GitHub come l'IZSUM.
      # Le sue gare si svolgono sulla piattaforma regionale GIADA: coprirla da lì.
      abilitato: false
      nome_fonte: ASL 1 Abruzzo
      sigla: asl1abruzzo
      ente: "ASL 1 Avezzano-Sulmona-L'Aquila"
      regione: Abruzzo
      lettore: tabella                # portale PAT di ISWEB: CIG / Oggetto / Link BDNCP / Data di pubblicazione
      max_pagine: 3                   # 20 righe per pagina, circa 3-4 settimane per pagina
      # Elenco misto: oltre a indizioni e delibere a contrarre contiene affidamenti diretti
      # e aggiudicazioni già concluse (con il nome del fornitore), che non sono opportunità.
      escludi_titoli_regex:
        - '^\W*(affidamento|trattativa)\s+dirett'
        - '\baggiudicazion'
        - 'differimento\s+fornitur'
      url: "https://trasparenza.asl1abruzzo.it/page/10/bandi-di-gara-e-contratti.html?p={pagina}"

# --- Sintel (ARIA, Lombardia) ------------------------------------------------
# Piattaforma di gara di tutte le aziende sanitarie lombarde (ASST, ATS, IRCCS,
# AREU) e di ARIA; la usano anche enti di altre regioni (es. ULSS e aziende
# ospedaliere del Veneto, AOU di Torino). Si legge la ricerca pubblica
# sintelSearch.xhtml: una ricerca per ogni regione ("Sede legale"), cosi' ogni
# gara ha la regione giusta. Vedi scout/sintel.py.
sintel:
  abilitato: true
  nome_fonte: Sintel
  sigla: sintel
  url: "https://www.sintel.regione.lombardia.it/eprocdata/sintelSearch.xhtml"
  url_dettaglio: "auctionDetail.xhtml?id={id}"
  stati: [Open, PublishedAcceptingRequest]      # Pubblicata, Aperta pre-qualifica
  per_regione: true             # false = una sola ricerca su tutte le sedi (regione "Non indicata")
  regioni: [Lombardia, Veneto, Piemonte, Liguria, Emilia Romagna, Marche, Lazio, Abruzzo, Campania, Sicilia]
  elementi_per_pagina: 200      # valori ammessi dal sito: 10, 25, 50, 100, 200
  max_pagine: 10                # per regione
  pausa_secondi: 1              # attesa tra una richiesta e l'altra
  tentativi: 2                  # nuovi tentativi per richiesta in caso di errore 5xx
  # Tipi Sintel da scartare: l'affidamento diretto e' gia' rivolto a un fornitore scelto.
  # Restano "Affidamento diretto previa richiesta di preventivi", indagini, manifestazioni e gare.
  escludi_tipi: ["Affidamento diretto"]

# --- Conservazione -----------------------------------------------------
giorni_conservazione_scadute: 30      # dopo la scadenza, per quanto tenere un avviso
giorni_conservazione_senza_scadenza: 120

# --- Piattaforme DigitalPA ("<ente>.acquistitelematici.it") --------------------
# L'elenco gare arriva da un servizio JSON (/ws/tender/fe) con titolo, date, stato,
# CPV, CIG e link. Molti enti italiani usano questa piattaforma: per aggiungerne uno
# basta un blocco con il suo indirizzo (host).
acquistitelematici:
  abilitato: true
  siti:
    - nome: IZSAM
      nome_fonte: IZSAM
      sigla: izsam
      host: "https://izs.acquistitelematici.it"
      ente: "IZSAM - Istituto Zooprofilattico Sperimentale dell'Abruzzo e del Molise G. Caporale"
      regione: Abruzzo
      tipi: [procedure-gara, manifestazioni-interesse]
      max_risultati: 50            # le più recenti per data di pubblicazione (circa 100 l'anno per tipo)
      escludi_stati: [annullata]
