# =====================================================================
#  Scouting bandi software / IT in ambito sanitario - configurazione
# =====================================================================

# --- Filtro CPV --------------------------------------------------------
# Un avviso passa il filtro CPV se almeno uno dei suoi codici inizia con
# uno di questi prefissi (si confrontano solo le cifre, senza "-x").
cpv_prefissi:
  - "48"        # Pacchetti software e sistemi di informazione
  - "72"        # Servizi informatici: consulenza, sviluppo, Internet, supporto
  # - "302"     # Apparecchiature informatiche (decommenta se ti interessa l'hardware)
  # - "64216"   # Servizi di messaggistica e informazione elettronica

# CPV che vengono inclusi SEMPRE, anche se l'ente non risulta sanitario.
cpv_sempre_inclusi:
  - "48180000"  # Pacchetti software medici
  - "48814000"  # Sistemi di informazione medica

# --- Riconoscimento enti sanitari -------------------------------------
# Espressioni regolari (case-insensitive) sul nome della stazione appaltante.
enti_sanitari_regex:
  - '\bA\.?S\.?L\b'
  - '\bA\.?S\.?P\b'
  - '\bASST\b'
  - '\bATS\b'
  - '\bA\.?U\.?S\.?L\b'
  - '\bU\.?L\.?S\.?S\b'
  - '\bA\.?O\.?U\.?I?\b'                  # Azienda Ospedaliero-Universitaria (AOU, A.O.U., AOUI)
  - '\bU\.?S\.?L\b'
  - '\bASU\s?(FC|GI)\b'
  - '\bAST\b'
  - '\bASUR\b'
  - '\bARCS\b'
  - '\bAREU\b'
  - '\bIRCCS\b'
  - 'azienda\s+(socio[\s-]?)?sanitari'
  - 'azienda\s+(universitari\w*\s+)?ospedalier'
  - 'ospedal'
  - 'policlinic'
  - 'istituto\s+zooprofilattico'
  - 'istituto\s+(nazionale\s+)?(dei\s+)?tumori'
  - 'azienda\s+zero'
  - '\bESTAR\b'
  - 'so\.?re\.?sa'
  - 'servizio\s+sanitario'
  - 'agenzia\s+regionale.*salute'

# Frasi che descrivono il CANALE della gara, non il suo oggetto: vengono ignorate
# prima di cercare le parole IT (altrimenti "affidamento su piattaforma telematica
# GIADA" di un farmaco sembrerebbe una gara informatica).
rumore_procedurale_regex:
  - '(su|sulla|tramite|mediante|attraverso|nella|con)\s+(la\s+|l[\x27\u2019]\s*)?(propria\s+)?piattaforma\s+((web|telematica|informatica|digitale|elettronica|regionale|aziendale|e-?procurement|di\s+e-?procurement|di\s+negoziazione)\s+)*([A-Z][\w\.\-]*)?'
  - '\b(RDO|trattativa\s+diretta|ODA)\s+(su\s+)?(il\s+)?MePA\b'
  - 'procedura\s+(aperta\s+|negoziata\s+|ristretta\s+)?(telematica|informatizzata)'

# Soggetti aggregatori che comprano sia per la sanità sia per altri settori:
# le loro gare IT vengono incluse ma marcate "da verificare".
aggregatori_misti_regex:
  - 'intercent'
  - '\bARIA\b'
  - 'azienda\s+regionale\s+per\s+l.innovazione\s+e\s+gli\s+acquisti'
  - '\bconsip\b'
  - 'innova\s*puglia'
  - 'punto\s*zero'                     # Umbria: compra per la sanità ma anche per la Regione
  - 'areacom|agenzia\s+regionale\s+dell.abruzzo\s+per\s+la\s+committenza'   # Abruzzo: sanità, Regione e comuni

# Parole chiave sul titolo/oggetto che indicano un contesto sanitario
# (servono per enti non sanitari, es. una Regione che compra un sistema FSE).
parole_chiave_sanita_regex:
  - 'sanitari'
  - 'ospedal'
  - 'clinic'
  - 'telemedicin'
  - 'telemonitor'
  - 'teleconsult'
  - 'fascicolo\s+sanitario'
  - '\bFSE\b'
  - 'cartella\s+clinica'
  - '\bRIS\b'
  - '\bPACS\b'
  - '\bLIS\b'
  - 'centro\s+unic\w*\s+(di\s+)?prenotazion'   # NB: non usare "CUP", collide con il Codice Unico di Progetto
  - 'prenotazion\w*\s+(delle\s+)?(prestazion|visite|esami)'
  - 'pronto\s+soccorso'
  - 'farmac'
  - 'pazient'
  - 'ricoveri'
  - 'ambulatori'
  - 'dossier\s+sanitario'
  - 'medicina\s+(generale|territoriale)'
  - 'case\s+della\s+comunit'
  - 'centrali\s+operative\s+territoriali|\bCOT\b'

# Parole chiave informatiche: servono per le fonti senza CPV (feed RSS dei
# portali regionali), dove l'oggetto IT si riconosce solo dal testo.
parole_chiave_it_regex:
  - 'software'
  - 'informatic'
  - 'informatizzat'                    # "soluzione informatizzata" (AO Padova su Sintel)
  - 'applicativ'
  - 'gestional'
  - 'sistem\w*\s+informativ'
  - 'piattaforma\s+(digitale|informatica|telematica|software|web|regionale)'
  - 'licenz\w*\s+(d.uso|software)'
  - '\blicenze\b'
  - '\bcloud\b'
  - 'data\s*center'
  - 'cyber'
  - 'anti-?virus|anti-?spam|anti-?malware|firewall|endpoint'
  - 'sicurezza\s+informatica'
  - 'threat\s+intelligence|\bddos\b|deep\s+web|dark\s+web|\bSIEM\b|vulnerability|penetration\s+test'
  - 'subscription'                     # rinnovi di abbonamenti software (es. "subscription WSO2")
  - 'full\s+managed|managed\s+(service|security)'
  - 'middleware|api\s+(gateway|management)'
  - '\bLIMS\b|laboratory\s+information|information\s+management\s+system'   # sistemi informativi di laboratorio (IZS)
  - 'digitalizzazion'
  - 'dematerializzazion'
  - 'interoperabilit'
  - 'telemedicin'
  - 'teleconsult'
  - 'telemonitor'
  - 'fascicolo\s+sanitario'
  - 'cartella\s+clinica'
  - '\bPACS\b'
  - '\bRIS\b'
  - '\bLIS\b'
  - '\bERP\b'
  - 'intelligenza\s+artificiale'
  - 'postazioni\s+di\s+lavoro'
  - 'rete\s+dati|networking'
  - 'manutenzione\s+(correttiva|evolutiva|adeguativa)'
  - '\bICT\b'
  - '\bIT\s+service'
  - '\bSaaS\b'
  - 'portale\s+web'
  - '\bapp\b'

# Esclusioni: se il titolo contiene una di queste, l'avviso viene scartato.
esclusioni_regex:
  - 'pulizi'
  - 'ristorazion'
  - 'lavanderi'
  - 'vigilanza\s+armata'
  - '\bausili'                                # ausili per pazienti (es. software di ingrandimento)
  - 'assistit[oa]\s+[A-Z]\.\s*[A-Z]\.'          # forniture nominative "assistito M.B."

# --- TED (Tenders Electronic Daily) -----------------------------------
ted:
  abilitato: true
  url: "https://api.ted.europa.eu/v3/notices/search"
  finestra_giorni: 10          # quanti giorni indietro guardare a ogni esecuzione
                               # (per recuperare lo storico alzalo a 90 per un lancio, poi riportalo a 10)
  max_pagine: 40               # 250 avvisi per pagina
  # Tipi di avviso da tenere (prefissi): cn = bando, pin = preinformazione.
  # Aggiungi "can" per raccogliere anche le aggiudicazioni.
  tipi_avviso_prefissi: ["cn", "pin"]
  campi:
    - publication-number
    - publication-date
    - notice-title
    - buyer-name
    - classification-cpv
    - deadline-receipt-tender-date-lot
    - notice-type
    - estimated-value-lot
    - links

# --- ANAC open data (dataset CIG) -------------------------------------
anac:
  abilitato: false              # dati CIG 2026 non ancora pubblicati
  base_url: "https://dati.anticorruzione.it/opendata"
  dataset_pattern: "cig-{anno}"    # id del dataset CKAN, un dataset per anno
  mesi_da_elaborare: 2             # al primo avvio, quanti file mensili recenti leggere
  solo_aperte: true                # tieni solo gare con scadenza offerta futura
  includi_senza_scadenza: false
  # Se l'API del portale risponde 403, lo script prova a scaricare direttamente
  # i file mensili con questo modello di indirizzo. Lascia vuoto se non serve.
  # Per compilarlo: apri il dataset CIG sul portale ANAC dal browser e copia il
  # link di download di un file mensile, sostituendo anno e mese con {anno} e {mese}.
  url_file_pattern: ""

