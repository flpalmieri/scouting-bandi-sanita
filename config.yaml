    # --- Toscana: portale gare SSR sanita.start.toscana.it (ESTAR) ---
    # Stesso software di EmPULIA e A.U.R.A. (campi afs:): stessa mappa dei campi.
    # Enti: ESTAR (centrale d'acquisto di tutte le aziende sanitarie toscane), USL Centro e
    # Nord Ovest, Careggi, Meyer, Regione Toscana. Circa 60 bandi in corso (19/11/2026).
    - nome: START Sanita bandi
      nome_fonte: START Sanità Toscana
      sigla: startsan
      regione: Toscana
      tipo: bando
      max_pagine: 10               # 20 per pagina; il feed dichiara il totale (totRecord)
      escludi_stati: [Revocato, Annullato]
      campi:                      # nomi dei campi afs: del feed (senza prefisso)
        titolo: [Oggetto, TitoloDocumento]
        descrizione: [TitoloDocumento]
        ente: [DenominazioneEnte, EnteProponente]
        scadenza: [DtScadenzaBandoTecnical]
        pubblicazione: [DtPubblicazioneTecnical]
        importo: [a_base_asta]
        cig: [CIG]
        cpv: [CPV]
        stato: [statoFunzionale]
        id: [IdMsg]
      # Il feed da' i link con /portale/index.php/, che sul sito risponde 404: la pagina vera
      # e' sotto /portalegare/index.php/ con gli stessi parametri (verificato il 19/11/2026).
      link_sostituisci:
        "/portale/index.php/": "/portalegare/index.php/"
      # Su TED ESTAR si chiama solo "ESTAR": stesso nome, cosi' main.py puo' fondere la stessa
      # gara vista su TED e su START Sanita' (se anche i titoli coincidono).
      enti_rinomina:
        "ESTAR - Ente di Supporto Tecnico Amministrativo Regionale": "ESTAR"
      # Procedure riservate agli operatori invitati, come gli affidamenti diretti di Sintel:
      # "Affidamento Diretto" (pagina di 624018: "Invito") e "Richiesta Preventivo" (pagina di
      # 623837: "Invito"; 624444 dichiara "affidamento diretto art. 50 c.1 lett. b"). Verificato il
      # 20/11/2026. Restano le "Negoziata" (art. 76 c.2 lett. b = unico fornitore: infungibilita').
      escludi_campi:
        TipoProcedura: [Affidamento Diretto, Richiesta Preventivo]
      url: "https://www.sanita.start.toscana.it/portale/rss_new.asp?Table=DASHBOARD_VIEW_DOCUMENTI_PUBBLICI&FilterHide=bScaduto%3D0+and+tipo%3C%3E%27Esito%27+&Filter=&ML_KEY=TEMPLATE_RSS_DPCM_ML&sort=DtScadenzaBandoTecnical&sortorder=asc&numRowForPag=20&nPag={pagina}"
      timeout_connessione: 20        # fonte nuova: se bloccasse GitHub, si perde poco tempo
      tentativi: 1
    - nome: START Sanita consultazioni
      # Consultazioni preliminari e avvisi esplorativi (quasi tutti ESTAR). Il feed ha circa
      # 950 voci comprese le vecchie, ordinate per scadenza decrescente: 3 pagine bastano.
      nome_fonte: START Sanità Toscana
      sigla: startsan-cons
      regione: Toscana
      tipo: consultazione di mercato
      max_pagine: 3
      escludi_stati: [Revocato, Annullato]
      campi:                      # stesso schema afs: dei bandi (verificato il 19/11/2026)
        titolo: [Oggetto, TitoloDocumento]
        descrizione: [TitoloDocumento]
        ente: [DenominazioneEnte, EnteProponente]
        scadenza: [DtScadenzaBandoTecnical]
        pubblicazione: [DtPubblicazioneTecnical]
        importo: [a_base_asta]
        cig: [CIG]
        cpv: [CPV]
        stato: [statoFunzionale]
        id: [IdMsg]
      # Il feed da' i link con /portale/index.php/, che sul sito risponde 404: la pagina vera
      # e' sotto /portalegare/index.php/ con gli stessi parametri (verificato il 19/11/2026).
      link_sostituisci:
        "/portale/index.php/": "/portalegare/index.php/"
      # Su TED ESTAR si chiama solo "ESTAR": stesso nome, cosi' main.py puo' fondere la stessa
      # gara vista su TED e su START Sanita' (se anche i titoli coincidono).
      enti_rinomina:
        "ESTAR - Ente di Supporto Tecnico Amministrativo Regionale": "ESTAR"
      url: "https://www.sanita.start.toscana.it/portale/rss_new.asp?Table=DASHBOARD_VIEW_DOCUMENTI_PUBBLICI_BANDO_CONSULTAZIONI&FilterHide=&Filter=&ML_KEY=TEMPLATE_RSS_DPCM_BANDO_CONSULTAZIONE_ML&sort=DtScadenzaBandoTecnical&sortorder=desc&numRowForPag=20&nPag={pagina}"
      timeout_connessione: 20
      tentativi: 1
    # Lazio (STELLA): le gare NON si leggono dal feed rss_new.asp, anche se ha lo schema afs: di
    # EmPULIA, perche' la scadenza del feed resta quella originale dopo rettifiche e proroghe
    # (verificato il 20/11/2026) e il filtro bScaduto='0' da' 1.460 voci, comprese molte chiuse.
    # Si leggono dall'API REST della Centrale Acquisti: vedi la sezione centrale_acquisti.

# --- Siti che pubblicano i bandi solo come pagine HTML ---------------------
# lettore: il modello di pagina (vedi scout/portali_html.py).
# ente: nome dell'ente, usato quando la pagina non lo riporta per ogni bando.
portali_html:
  abilitato: true
  siti:
    - nome: USL Umbria 1
      nome_fonte: USL Umbria 1
      sigla: uslumbria1
      ente: USL Umbria 1
      regione: Umbria
      lettore: scheda_sito
